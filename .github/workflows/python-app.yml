name: Python Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m venv venv
        . venv/bin/activate
        pip install -r requirements.txt
        
    - name: Lint with ruff
      run: |
        . venv/bin/activate
        pip install ruff
        ruff check .
        
    - name: Run tests
      run: |
        . venv/bin/activate
        echo "No tests configured yet"
